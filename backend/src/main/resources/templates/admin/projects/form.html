<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>[ PROJECT EDITOR ]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000000; color: #ffffff; }
        .header { background: #000000; border-bottom: 1px solid #ffffff; padding: 20px; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; letter-spacing: 2px; }
        .header h1::before { content: '# '; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #000000; border: 1px solid #ffffff; padding: 40px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; color: #ffffff; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        label::before { content: '> '; }
        input, textarea, select { width: 100%; padding: 12px; background: #000000; border: 1px solid #ffffff; color: #ffffff; font-family: 'Inter', sans-serif; font-size: 12px; }
        textarea { min-height: 120px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #00ff00; }
        select option { background: #000000; color: #ffffff; }
        input::placeholder, textarea::placeholder { color: #666666; }
        .btn { padding: 12px 30px; border: none; cursor: pointer; text-decoration: none; display: inline-block; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 700; }
        .btn-primary { background: #ffffff; color: #000000; border-radius: 50px; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #000000; color: #ffffff; border: 1px solid #ffffff; border-radius: 50px; }
        .btn-secondary:hover { background: #ffffff; color: #000000; }
        .form-actions { display: flex; gap: 15px; margin-top: 35px; }
        .btn-back { background: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 10px 24px; text-decoration: none; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 11px; border-radius: 50px; font-weight: 700; letter-spacing: 1px; }
        .btn-back:hover { background: #ffffff; color: #000000; }
        .hint { font-size: 10px; color: #666666; margin-top: 5px; }
        .hint::before { content: '// '; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 th:text="${project.id != null ? 'EDIT PROJECT ENTRY' : 'NEW PROJECT ENTRY'}">PROJECT EDITOR</h1>
            <a href="/admin/projects" class="btn-back">Back</a>
        </div>
    </div>
    
    <div class="container">
        <div class="form-card">
            <form th:action="@{/admin/projects/save}" th:object="${project}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" th:field="*{title}" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" th:field="*{description}" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="technologies">Technologies</label>
                    <input type="text" id="technologies" th:field="*{technologies}" placeholder="React, Node.js, MongoDB">
                    <div class="hint">comma-separated list</div>
                </div>
                
                <div class="form-group">
                    <label for="githubUrl">GitHub URL</label>
                    <input type="text" id="githubUrl" th:field="*{githubUrl}">
                </div>
                
                <div class="form-group">
                    <label for="liveUrl">Live Demo URL</label>
                    <input type="text" id="liveUrl" th:field="*{liveUrl}">
                </div>
                
                <div class="form-group">
                    <label for="previewImage">Preview Image</label>
                    <input type="hidden" id="previewImageUrl" th:field="*{previewImageUrl}">
                    <button type="button" onclick="document.getElementById('previewFileInput').click()" class="btn btn-secondary">Upload Preview Image</button>
                    <input type="file" id="previewFileInput" accept="image/*" style="display: none;" onchange="uploadPreviewImage(this)">
                    <div id="previewImagePreview" style="margin-top: 15px;"></div>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" th:field="*{status}" required>
                        <option value="">-- Select Status --</option>
                        <option value="Completed">Completed</option>
                        <option value="Active Development">Active Development</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="completedDate">Completed Date</label>
                    <input type="text" id="completedDate" th:field="*{completedDate}" placeholder="Jan 2024">
                    <div class="hint">Format: Month Year (e.g., Jan 2024)</div>
                </div>

                <div class="form-group">
                    <label for="showCodeButton">Show Code Button</label>
                    <input type="checkbox" id="showCodeButton" th:field="*{showCodeButton}" style="width: auto; margin-left: 10px;">
                </div>

                <div class="form-group">
                    <label for="showLiveDemoButton">Show Live Demo Button</label>
                    <input type="checkbox" id="showLiveDemoButton" th:field="*{showLiveDemoButton}" style="width: auto; margin-left: 10px;">
                </div>

                <input type="hidden" th:field="*{displayOrder}" value="0">
                <input type="hidden" th:field="*{isPublished}" value="true">

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Entry</button>
                    <a href="/admin/projects" class="btn btn-secondary">Cancel</a>
                </div>

                <script>
                    async function uploadPreviewImage(input) {
                        if (input.files && input.files[0]) {
                            const file = input.files[0];
                            const formData = new FormData();
                            formData.append('file', file);
                            formData.append('category', 'projects');

                            try {
                                const response = await fetch('/admin/api/upload/image', {
                                    method: 'POST',
                                    body: formData
                                });

                                const result = await response.json();

                                if (result.success) {
                                    document.getElementById('previewImageUrl').value = result.fileUrl;
                                    document.getElementById('previewImagePreview').innerHTML =
                                        '<img src="' + result.fileUrl + '" style="max-width: 300px; border: 1px solid #ffffff; margin-top: 10px;">';
                                    alert('✓ Preview image uploaded successfully!');
                                } else {
                                    alert('✗ Upload failed: ' + result.message);
                                }
                            } catch (error) {
                                alert('✗ Upload error: ' + error.message);
                            }
                        }
                    }

                    // Show existing preview image if present
                    window.addEventListener('DOMContentLoaded', function() {
                        const previewImageUrl = document.getElementById('previewImageUrl').value;
                        if (previewImageUrl) {
                            document.getElementById('previewImagePreview').innerHTML =
                                '<img src="' + previewImageUrl + '" style="max-width: 300px; border: 1px solid #ffffff; margin-top: 10px;">';
                        }
                    });
                </script>
            </form>
        </div>
    </div>
</body>
</html>
