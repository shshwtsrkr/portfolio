<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ SECURE ACCESS ]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: #000000;
            border: 1px solid #ffffff;
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        
        .terminal-header {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 16px;
            letter-spacing: 2px;
        }
        
        .terminal-subtitle {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 11px;
            opacity: 0.6;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        label::before {
            content: '> ';
        }
        
        input {
            width: 100%;
            padding: 12px;
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        
        input:focus {
            outline: none;
            border-color: #00ff00;
        }
        
        input::placeholder {
            color: #666666;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .error {
            background: #000000;
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
        }
        
        .error::before {
            content: '[!] ';
        }
        
        .success {
            background: #000000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
        }
        
        .success::before {
            content: '[✓] ';
        }
        
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="terminal-header">[ SECURE ACCESS ]</div>
        <div class="terminal-subtitle">// ADMIN TERMINAL <span class="cursor">█</span></div>
        
        <div th:if="${param.error}" class="error">
            INVALID CREDENTIALS
        </div>
        <div th:if="${param.logout}" class="success">
            LOGOUT SUCCESSFUL
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Access System</button>
        </form>
    </div>
</body>
</html>
