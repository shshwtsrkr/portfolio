<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>[ BLOG EDITOR ]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000000; color: #ffffff; }
        .header { background: #000000; border-bottom: 1px solid #ffffff; padding: 20px; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; letter-spacing: 2px; }
        .header h1::before { content: '# '; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #000000; border: 1px solid #ffffff; padding: 40px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; color: #ffffff; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        label::before { content: '> '; }
        input, textarea { width: 100%; padding: 12px; background: #000000; border: 1px solid #ffffff; color: #ffffff; font-family: 'Inter', sans-serif; font-size: 12px; }
        textarea { min-height: 120px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #00ff00; }
        input::placeholder, textarea::placeholder { color: #666666; }
        .btn { padding: 12px 30px; border: none; cursor: pointer; text-decoration: none; display: inline-block; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 700; }
        .btn-primary { background: #ffffff; color: #000000; border-radius: 50px; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #000000; color: #ffffff; border: 1px solid #ffffff; border-radius: 50px; }
        .btn-secondary:hover { background: #ffffff; color: #000000; }
        .form-actions { display: flex; gap: 15px; margin-top: 35px; }
        .btn-back { background: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 10px 24px; text-decoration: none; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 11px; border-radius: 50px; font-weight: 700; letter-spacing: 1px; }
        .btn-back:hover { background: #ffffff; color: #000000; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 th:text="${blog.id != null ? 'EDIT BLOG ENTRY' : 'NEW BLOG ENTRY'}">BLOG EDITOR</h1>
            <a href="/admin/blogs" class="btn-back">Back</a>
        </div>
    </div>
    
    <div class="container">
        <div class="form-card">
            <form th:action="@{/admin/blogs/save}" th:object="${blog}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" th:field="*{title}" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" th:field="*{description}" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" th:field="*{content}" style="min-height: 200px;"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="date">Date (YYYY-MM-DD)</label>
                    <input type="text" id="date" th:field="*{date}" placeholder="2024-10-19">
                </div>
                
                <div class="form-group">
                    <label for="tag">Tag</label>
                    <input type="text" id="tag" th:field="*{tag}" placeholder="e.g., DevOps, Technical, Tutorial">
                </div>

                <div class="form-group">
                    <label for="tagColor">Tag Color (Hex)</label>
                    <input type="color" id="tagColor" th:field="*{tagColor}" value="#6366f1" style="height: 50px; cursor: pointer;">
                </div>

                <div class="form-group">
                    <label for="readDuration">Read Duration (minutes)</label>
                    <input type="number" id="readDuration" th:field="*{readDuration}" placeholder="5" min="1">
                </div>

                <div class="form-group">
                    <label for="thumbnail">Thumbnail Image</label>
                    <input type="hidden" id="thumbnailUrl" th:field="*{thumbnailUrl}">
                    <button type="button" onclick="document.getElementById('thumbnailFileInput').click()" class="btn btn-secondary">Upload Thumbnail</button>
                    <input type="file" id="thumbnailFileInput" accept="image/*" style="display: none;" onchange="uploadThumbnail(this)">
                    <div id="thumbnailPreview" style="margin-top: 15px;"></div>
                </div>

                <div class="form-group">
                    <label for="externalUrl">External URL</label>
                    <input type="text" id="externalUrl" th:field="*{externalUrl}">
                </div>

                <input type="hidden" th:field="*{displayOrder}" value="0">
                <input type="hidden" th:field="*{isPublished}" value="true">

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Entry</button>
                    <a href="/admin/blogs" class="btn btn-secondary">Cancel</a>
                </div>

                <script>
                    async function uploadThumbnail(input) {
                        if (input.files && input.files[0]) {
                            const file = input.files[0];
                            const formData = new FormData();
                            formData.append('file', file);
                            formData.append('category', 'blogs');

                            try {
                                const response = await fetch('/admin/api/upload/image', {
                                    method: 'POST',
                                    body: formData
                                });

                                const result = await response.json();

                                if (result.success) {
                                    document.getElementById('thumbnailUrl').value = result.fileUrl;
                                    document.getElementById('thumbnailPreview').innerHTML =
                                        '<img src="' + result.fileUrl + '" style="max-width: 300px; border: 1px solid #ffffff; margin-top: 10px;">';
                                    alert('✓ Thumbnail uploaded successfully!');
                                } else {
                                    alert('✗ Upload failed: ' + result.message);
                                }
                            } catch (error) {
                                alert('✗ Upload error: ' + error.message);
                            }
                        }
                    }

                    // Show existing thumbnail if present
                    window.addEventListener('DOMContentLoaded', function() {
                        const thumbnailUrl = document.getElementById('thumbnailUrl').value;
                        if (thumbnailUrl) {
                            document.getElementById('thumbnailPreview').innerHTML =
                                '<img src="' + thumbnailUrl + '" style="max-width: 300px; border: 1px solid #ffffff; margin-top: 10px;">';
                        }
                    });
                </script>
            </form>
        </div>
    </div>
</body>
</html>
