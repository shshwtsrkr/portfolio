<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ ADMIN TERMINAL ]</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
        
        .header {
            background: #000000;
            border-bottom: 1px solid #ffffff;
            padding: 20px;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        
        .header h1::before {
            content: '# ';
        }
        
        .logout-btn {
            background: #ffffff;
            color: #000000;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .logout-btn:hover {
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .welcome-text {
            margin-bottom: 10px;
            color: #ffffff;
            font-size: 13px;
        }
        
        .welcome-text::before {
            content: '>> ';
        }
        
        .status {
            color: #666666;
            margin-bottom: 40px;
            font-size: 11px;
        }
        
        .status-online {
            color: #00ff00;
        }
        
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .card {
            background: #000000;
            border: 1px solid #ffffff;
            padding: 30px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .card:hover {
            background: #111111;
        }
        
        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        
        .card h2 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .card h2::before {
            content: '[ ';
        }
        
        .card h2::after {
            content: ' ]';
        }
        
        .card p {
            color: #666666;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>ADMIN TERMINAL</h1>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-text">SYSTEM ACCESS GRANTED</div>
        <div class="status">[ STATUS: <span class="status-online">ONLINE</span> <span class="cursor">█</span> ]</div>
        
        <div class="card-grid">
            <a href="/admin/profile/home-editor" class="card">
                <div class="card-icon">🏠</div>
                <h2>Home Page</h2>
                <p>// edit home page content</p>
            </a>

            <a href="/admin/profile" class="card">
                <div class="card-icon">👤</div>
                <h2>Profile</h2>
                <p>// manage personal data</p>
            </a>

            <a href="/admin/blogs" class="card">
                <div class="card-icon">📝</div>
                <h2>Blogs</h2>
                <p>// create & edit posts</p>
            </a>

            <a href="/admin/projects" class="card">
                <div class="card-icon">💻</div>
                <h2>Projects</h2>
                <p>// portfolio management</p>
            </a>

            <a href="/admin/publications" class="card">
                <div class="card-icon">📚</div>
                <h2>Publications</h2>
                <p>// research database</p>
            </a>

            <a href="/admin/database" class="card">
                <div class="card-icon">🗄️</div>
                <h2>Database</h2>
                <p>// mysql management</p>
            </a>
        </div>
    </div>
</body>
</html>
